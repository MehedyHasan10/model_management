
name: Model Management Auto Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-management-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend, Backend and Database
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu

            echo "Starting Model Management deployment..."

            # Go to project directory
            cd /var/www/model-management

            # Pull latest code
            echo "Pulling latest GitHub code..."
            git pull --ff-only origin main

            # Install backend dependencies
            echo "Installing backend dependencies..."
            cd backend
            npm ci

            # Generate Prisma Client
            echo "Generating Prisma Client..."
            npx prisma generate

            # Install frontend dependencies
            echo "Installing frontend dependencies..."
            cd ../frontend
            npm ci

            # Build backend
            echo "Building backend..."
            cd ../backend
            npm run build

            # Build frontend
            echo "Building frontend..."
            cd ../frontend
            npm run build

            # Apply pending database migrations
            echo "Applying Prisma database migrations..."
            cd ../backend
            npx prisma migrate deploy

            # Restart backend
            echo "Restarting backend API..."
            pm2 restart model-management-api --update-env

            # Restart frontend
            echo "Restarting frontend..."
            pm2 restart model-management-web --update-env

            # Save PM2 configuration
            echo "Saving PM2 processes..."
            pm2 save

            echo "Model Management deployment successful!"
