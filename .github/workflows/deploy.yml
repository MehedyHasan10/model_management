
name: Model Management Auto Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd /var/www/model-management

            git pull --ff-only origin main

            cd backend
            npm ci
            npx prisma generate
            npm run build

            cd ../frontend
            npm ci
            npm run build

            pm2 restart model-management-api
            pm2 restart model-management-web

            echo "Deployment successful!"
